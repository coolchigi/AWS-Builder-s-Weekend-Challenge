AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Roost - a platform for always-on agents. One core lifecycle (wake, sense,
  reason, remember, publish, alert) deployed as an isolated stack per app. The
  Adapter parameter chooses which app this stack runs (word, flight, ...). Each
  stack owns its own Lambda, DynamoDB memory, and public S3 site.

Parameters:
  Adapter:
    Type: String
    Default: word
    AllowedValues: [word, flight]
    Description: >
      Which app this stack runs. Add values as you add adapters. Multiple stacks
      can share the same slug (e.g. two flight stacks for YOW-LOS and YOW-ABV)
      — each stack is fully isolated with its own DynamoDB table, S3 bucket, and
      SNS topic. Use different config-envs in samconfig.toml to deploy them.
  NotifyEmail:
    Type: String
    Default: ""
    Description: >
      Alert email. Leave empty to deploy without a subscription (subscribe your
      email to the topic afterward), or pass it at deploy to auto-subscribe.
  Schedule:
    Type: String
    Default: "cron(0 13 * * ? *)"
    Description: How often the agent wakes. word=daily, flight=rate(6 hours).
  ModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: Bedrock model id. Nova Lite is cheap and Free-Tier-friendly.

  # --- word app ---
  WeatherLatLon:
    Type: String
    Default: "45.42,-75.70"
    Description: "lat,lon to theme the word to today's weather (Open-Meteo). Default Ottawa."

  # --- flight app ---
  Route:
    Type: String
    Default: "YOW-LOS"
    Description: "Origin-Destination IATA codes, e.g. YOW-LOS."
  DepartDate:
    Type: String
    Default: "2026-12-15"
  ReturnDate:
    Type: String
    Default: ""
    Description: "Empty for one-way."
  Adults:
    Type: String
    Default: "1"
  Currency:
    Type: String
    Default: "CAD"
  FlightDropPct:
    Type: String
    Default: "5"
    Description: "Email when the fare drops at least this percent from the last check."
  CabinClass:
    Type: String
    Default: "economy"
    AllowedValues: [economy, premium_economy, business, first]
  MockBase:
    Type: String
    Default: ""
    Description: >
      Override the mock fare baseline (CAD). Empty = auto (1400 for YOW-LOS,
      1600 for YOW-ABV, 1200 for everything else). Only used when no Duffel token
      is set on the function. Set per-stack in samconfig.toml so each route gets a
      realistic starting price.

Conditions:
  HasEmail: !Not [!Equals [!Ref NotifyEmail, ""]]

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:
  Memory:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Public static website so each app has a live URL for its submission.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      WebsiteConfiguration:
        IndexDocument: index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Roost ${Adapter}"

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotifyEmail
      TopicArn: !Ref AlertTopic

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          ADAPTER: !Ref Adapter
          MODEL_ID: !Ref ModelId
          TABLE_NAME: !Ref Memory
          BUCKET_NAME: !Ref SiteBucket
          ALERT_TOPIC_ARN: !Ref AlertTopic
          WEATHER_LATLON: !Ref WeatherLatLon
          ROUTE: !Ref Route
          DEPART_DATE: !Ref DepartDate
          RETURN_DATE: !Ref ReturnDate
          ADULTS: !Ref Adults
          CURRENCY: !Ref Currency
          FLIGHT_DROP_PCT: !Ref FlightDropPct
          CABIN_CLASS: !Ref CabinClass
          MOCK_BASE: !Ref MockBase
      Policies:
        - Statement:
            - Sid: InvokeBedrock
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref Memory
        - S3CrudPolicy:
            BucketName: !Ref SiteBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: !Ref Schedule
            Description: !Sub "Wake the ${Adapter} agent."

Outputs:
  App:
    Description: Which app this stack runs
    Value: !Ref Adapter
  FunctionName:
    Description: Lambda function name (invoke it manually to run once now)
    Value: !Ref AgentFunction
  SiteURL:
    Description: Live web page for this app (put this in your submission)
    Value: !GetAtt SiteBucket.WebsiteURL
