version = 0.1

# One template, one config-env per app. Deploy an app with:
#   sam build
#   sam deploy --config-env word
#   sam deploy --config-env flight
# No --parameter-overrides needed: the alert email comes from the SSM parameter
# /roost/notify-email, and the Duffel token from /roost/duffel-token. Create both
# once (see README). Each config-env is its own isolated CloudFormation stack.

[default.global.parameters]
resolve_s3 = true
region = "us-east-1"          # Nova models live in us-east-1
capabilities = "CAPABILITY_IAM"
confirm_changeset = false

# --- Daily Lexicon: one rare word a day ---
[word.deploy.parameters]
stack_name = "roost-word"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=word",
  "Schedule=cron(0 13 * * ? *)",
  "WeatherLatLon=45.42,-75.70",
]

# --- Flight Watch: track one route's fare ---
# Live fares come from Duffel via the /roost/duffel-token SSM SecureString.
# If that parameter is absent, a mock fare feed runs so you can still demo.
#   sam deploy --config-env flight
[flight.deploy.parameters]
stack_name = "roost-flight"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=flight",
  "Schedule=rate(6 hours)",
  "Route=YOW-LOS",
  "DepartDate=2026-12-15",
  "ReturnDate=2026-12-29",
  "Currency=CAD",
  "FlightDropPct=5",
  "MockBase=1400",
]

# --- Flight Watch: Ottawa → Abuja (YOW-ABV) ---
# A second isolated stack, same adapter, different route.
# Deploy with:
#   sam deploy --config-env flight-abv
[flight-abv.deploy.parameters]
stack_name = "roost-flight-abv"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=flight",
  "Schedule=rate(6 hours)",
  "Route=YOW-ABV",
  "DepartDate=2026-12-15",
  "ReturnDate=2026-12-29",
  "Currency=CAD",
  "FlightDropPct=5",
  "MockBase=1600",
]
