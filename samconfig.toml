version = 0.1

# One template, one config-env per app. Deploy with no --parameter-overrides:
#   sam build
#   sam deploy --config-env word
#   sam deploy --config-env flight
# After deploy, on each stack (once): subscribe your email to the SNS topic, and
# for Flight Watch set the DUFFEL_TOKEN env var on the Lambda for live fares.
# Keeping those off the CLI avoids overriding (and wiping) these config values.
# Each config-env is its own isolated CloudFormation stack.

[default.global.parameters]
resolve_s3 = true
region = "us-east-1"          # Nova models live in us-east-1
capabilities = "CAPABILITY_IAM"
confirm_changeset = false

# --- Daily Lexicon: one rare word a day ---
[word.deploy.parameters]
stack_name = "roost-word"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=word",
  "Schedule=cron(0 13 * * ? *)",
  "WeatherLatLon=45.42,-75.70",
]

# --- Flight Watch: track one route's fare ---
# Live fares come from Duffel via the DUFFEL_TOKEN env var, set on the function
# after deploy. Without it, a mock fare feed runs so you can still demo.
#   sam deploy --config-env flight
[flight.deploy.parameters]
stack_name = "roost-flight"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=flight",
  "Schedule=rate(6 hours)",
  "Route=YOW-LOS",
  "DepartDate=2026-12-15",
  "ReturnDate=2026-12-29",
  "Currency=CAD",
  "FlightDropPct=5",
  "MockBase=1400",
]



# --- Flight Watch: Ottawa → Abuja (YOW-ABV) ---
# A second isolated stack, same adapter, different route.
# Deploy with:
#   sam deploy --config-env flight-abv
[flight-abv.deploy.parameters]
stack_name = "roost-flight-abv"
resolve_s3 = true
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = [
  "Adapter=flight",
  "Schedule=rate(6 hours)",
  "Route=YOW-ABV",
  "DepartDate=2026-12-15",
  "ReturnDate=2026-12-29",
  "Currency=CAD",
  "FlightDropPct=5",
  "MockBase=1600",
]
